name: Télécharger les chartes IA

on:
  workflow_dispatch:
  push:
    branches: [claude/determined-hypatia-ourqgf]
    paths:
      - "chartes-ia-universites/scripts/**"
      - ".github/workflows/telecharger-chartes-ia.yml"

permissions:
  contents: write

concurrency:
  group: telecharger-chartes-ia
  cancel-in-progress: true

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer poppler (extraction de texte)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Télécharger les documents
        working-directory: chartes-ia-universites
        run: python3 scripts/telecharger.py

      - name: Extraire le texte des deux premières pages
        working-directory: chartes-ia-universites/documents
        run: |
          mkdir -p _texte
          for f in *.pdf; do
            [ -e "$f" ] || continue
            pdftotext -f 1 -l 2 -layout "$f" "_texte/${f%.pdf}.txt" || echo "échec extraction $f"
            pdfinfo "$f" > "_texte/${f%.pdf}.info" 2>/dev/null || true
          done

      - name: Commiter les documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chartes-ia-universites/documents
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -m "Télécharge les chartes IA référencées (workflow)"
          git push
